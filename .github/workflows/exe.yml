# Oberkommando der Meumeu : à chaque mise à jour de main, les bancs de test tournent, puis une machine Windows
# fabrique l'exe et le publie dans les « Releases » du dépôt. Le dernier est toujours ici :
# https://github.com/alexandrelaplanche22300-star/meumeu/releases/latest/download/OberkommandoDerMeumeu.exe
name: Fabriquer l'exe

on:
  push:
    branches: [main, 'claude/**']
    paths: ['oberkommando/**', '.github/workflows/exe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bancs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oberkommando/jeu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Les bancs de test
        run: node test/node.mjs

  exe:
    needs: bancs
    runs-on: windows-latest
    defaults:
      run:
        working-directory: oberkommando
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Outils
        run: python -m pip install --upgrade pip pyinstaller pywebview
      - name: Fabriquer l'exe
        run: python -m PyInstaller --noconfirm --distpath release Oberkommando.spec
      - name: Garder l'exe (toutes les branches)
        uses: actions/upload-artifact@v4
        with:
          name: OberkommandoDerMeumeu
          path: oberkommando/release/OberkommandoDerMeumeu.exe
      - name: Publier (main seulement)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "jeu-${{ github.run_number }}" release/OberkommandoDerMeumeu.exe \
            --title "Oberkommando der Meumeu — version ${{ github.run_number }}" \
            --notes "Téléchargez OberkommandoDerMeumeu.exe ci-dessous et double-cliquez : le jeu s'ouvre dans sa propre fenêtre. Rien à installer (Windows 10 ou 11). La partie est sauvée dans %APPDATA%\\OberkommandoDerMeumeu." \
            --latest
