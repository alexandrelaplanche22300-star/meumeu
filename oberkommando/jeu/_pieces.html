<!doctype html><meta charset="utf-8"><title>Pièces</title>
<style>html,body{margin:0;background:#20221c;overflow:hidden}canvas{position:absolute;left:0;top:0}</style>
<canvas id="gl"></canvas><canvas id="ov"></canvas>
<script type="module">
// Page d'inspection (temporaire, hors livraison) : les pièces d'un modèle converti avec « convertir.cjs --objets », chacune d'une couleur,
// son numéro à son centre, en quatre vues orthographiques (côté, dessus, avant, trois-quarts). ?m=<nom> (fichier _pieces/<nom>.json) &only=1,2,3
import * as THREE from './js/lib/three.module.js';
import {loadModel} from './js/mesh3d.js';
const Q=new URLSearchParams(location.search);const W=innerWidth,H=innerHeight;
const gl=document.getElementById('gl'),ov=document.getElementById('ov');gl.width=ov.width=W;gl.height=ov.height=H;
const R=new THREE.WebGLRenderer({canvas:gl,antialias:true});R.setSize(W,H,false);R.setScissorTest(true);
const M=await loadModel(Q.get('m'),'_pieces/');const only=Q.get('only')?new Set(Q.get('only').split(',').map(s=>'tripo_part_'+s)):null;
const scene=new THREE.Scene();scene.add(new THREE.AmbientLight(0xffffff,.55));const sun=new THREE.DirectionalLight(0xffffff,.9);sun.position.set(2,4,3);scene.add(sun);
const num=n=>+String(n).replace(/\D/g,'');const items=[];
for(const p of M.parts){if(only&&!only.has(p.name))continue;const k=num(p.name);const col=new THREE.Color().setHSL((k*.618)%1,.7,.55);
  const mesh=new THREE.Mesh(p.geo,new THREE.MeshLambertMaterial({color:col,flatShading:true}));scene.add(mesh);p.geo.computeBoundingBox();const c=new THREE.Vector3();p.geo.boundingBox.getCenter(c);items.push({k,c,col,tris:p.tris});}
const box=new THREE.Box3().setFromObject(scene);const ctr=new THREE.Vector3();box.getCenter(ctr);const sz=new THREE.Vector3();box.getSize(sz);const S=Math.max(sz.x,sz.y,sz.z)*.62;
const ALL=[['vue +z',[0,0,1]],['dessus',[0,1,0.0001]],['vue +x',[1,0,0]],['trois-quarts',[1,.8,1.2]],['trois-quarts arrière',[-1,.8,-1.2]],['dessous',[0,-1,0.0001]]];const one=Q.get('v');const views=one!=null?[ALL[+one]]:ALL.slice(0,4);const full=one!=null;
const g=ov.getContext('2d');g.font=(full?'bold 15px':'11px')+' monospace';g.textAlign='center';g.textBaseline='middle';
views.forEach(([name,d],i)=>{const x=full?0:(i%2)*W/2,y=full?0:(i>>1)*H/2,w=full?W:W/2,h=full?H:H/2;const asp=w/h;
  const cam=new THREE.OrthographicCamera(-S*asp,S*asp,S,-S,-10,10);const dir=new THREE.Vector3(...d).normalize();cam.position.copy(ctr).addScaledVector(dir,4);cam.up.set(0,1,0);if(name==='dessus')cam.up.set(-1,0,0);cam.lookAt(ctr);cam.updateMatrixWorld();
  R.setViewport(x,H-y-h,w,h);R.setScissor(x,H-y-h,w,h);R.setClearColor(i%3?0x262820:0x2c2e25);R.render(scene,cam);
  g.fillStyle='#ddd';g.fillText(name,x+60,y+14);
  for(const it of items){if(full&&it.tris<Number(Q.get('min')||0))continue;const v=it.c.clone().project(cam);const sx=x+(v.x+1)/2*w,sy=y+(1-v.y)/2*h;g.fillStyle='rgba(0,0,0,.55)';g.fillRect(sx-(full?13:9),sy-(full?9:6),full?26:18,full?18:12);g.fillStyle='#fff';g.fillText(it.k,sx,sy);}});
document.title='prêt';
</script>
