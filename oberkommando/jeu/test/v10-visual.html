<!doctype html><meta charset="utf-8"><title>QA V10</title><base href="/"><script type="module">
const text=await (await fetch('/index.html')).text();document.documentElement.innerHTML=text.replace('<head>','<head><base href="/">').replace(/<script type="module" src="js\/ui.js"><\/script>/,'');await import('/js/ui.js');
const qa=document.createElement('div');qa.style='position:fixed;bottom:4px;right:4px;z-index:99999;padding:8px;background:#29434a;color:white';qa.innerHTML='<button id="qa-night">QA : équipe nocturne</button><button id="qa-battle">QA : combat et pièce</button><span id="qa-status"></span>';document.body.append(qa);
let team=[];function setup(){const w=window.world(),c=w.capital();w.beeeTick=()=>{};w.s.solar=22;team=[];window.view.sel.clear();for(let n=0;n<4;n++){const p=w.freeSpot(c.i+9+n*2,c.j+6,6),u=w.addUnit('meumeu','soldat',...p,{w:'mle1'});u.mag=5;u.pouch=200;u.bino=35;u.irLeft=8;u.irMax=8;u.nvOn=true;u.jum=20;u.camo=true;u.charges=2;u.fx=1;u.fy=0;u.holdFire=true;u.roe='retenu';u.task={kind:'guard',tx:u.x,ty:u.y,hold:true};team.push(u);window.view.sel.add(u.id);}window.view.lookAt(team[0].x+5,team[0].y);w.gridBuild();w.meumeuHear(team[0].x+20,team[0].y+8,185,'train');window.renderPanel(true);document.querySelector('#qa-status').textContent='4 soldats · NV · jumelles · charges · son de train';}
document.querySelector('#qa-night').onclick=setup;document.querySelector('#qa-battle').onclick=()=>{setup();const w=window.world(),p=w.freeSpot(team[0].x+3,team[0].y+4,6),gun=w.addUnit('meumeu','canon',...p);gun.mag=1;gun.pouch=20;for(let n=0;n<w.W(gun.w).crew-1;n++)w.addUnit('meumeu','soldat',p[0]+.8+n*.3,p[1]+.5,{w:'mle1',serve:gun.id});for(const u of team){u.holdFire=false;u.roe='libre';}for(let n=0;n<12;n++){const p=w.freeSpot(team[0].x+7+n%4,team[0].y+3+(n/4|0),6);const e=w.addUnit('beee','soldat',...p,{w:'bee_fusil'});e.mag=5;e.pouch=100;}w.gridBuild();w.blast(team[0].x+9,team[0].y+6,'obus','meumeu',gun.id);document.querySelector('#qa-status').textContent='Combat réel · servants · cratère · FX';};
</script>
