<!doctype html><meta charset="utf-8"><title>Pivots</title>
<style>html,body{margin:0;background:#20221c;overflow:hidden;font:13px sans-serif;color:#ddd}canvas{position:absolute;left:0;top:0}</style><canvas id="gl"></canvas><canvas id="ov"></canvas>
<script type="module">
// Page d'essai (temporaire, hors livraison) : les pivots des véhicules tels que le jeu les charge — tourelle (centre de sa couronne), roues (une roue
// par pièce), largeur visible contre emprise logique ; vue de dessus avec la tourelle superposée à 0°, 90°, 180°, 270°.
import * as THREE from './js/lib/three.module.js';
import {loadModel} from './js/mesh3d.js';
import {VEHDEF} from './js/vehicules.js';
const W=innerWidth,H=innerHeight;const gl=document.getElementById('gl'),ov=document.getElementById('ov');gl.width=ov.width=W;gl.height=ov.height=H;
const R=new THREE.WebGLRenderer({canvas:gl,antialias:true,preserveDrawingBuffer:true});R.setSize(W,H,false);R.setScissorTest(true);const g2=ov.getContext('2d');
const kinds=Object.keys(VEHDEF).filter(k=>k!=='jeep');const report={};const cols=kinds.length;
const COL=[0xff5040,0x40d0ff,0xffd040,0x80ff60];
for(let n=0;n<kinds.length;n++){const k=kinds[n],V=VEHDEF[k];const M=await loadModel(V.modele);const ax=V.avant[1]==='x'?0:2,lat=2-ax;const sc=V.long/M.ext[ax];
  const r={sc:+sc.toFixed(4),visLong:+(M.ext[ax]*sc).toFixed(2),visLarge:+(M.ext[lat]*sc).toFixed(2),large:V.large,visHaut:+(M.ext[1]*sc).toFixed(2),parts:{}};
  for(const p of M.parts){const pos=p.geo.attributes.position;let mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];for(let i=0;i<pos.count;i++){const v=[pos.getX(i),pos.getY(i),pos.getZ(i)];for(let a=0;a<3;a++){mn[a]=Math.min(mn[a],v[a]);mx[a]=Math.max(mx[a],v[a]);}}
    const ext=[0,1,2].map(a=>mx[a]-mn[a]),c=[0,1,2].map(a=>(mn[a]+mx[a])/2);const q={pivot:p.pivot.map(x=>+(x*sc).toFixed(3))};
    if(p.name.startsWith('roue')){q.longSurHaut=+(ext[ax]/ext[1]).toFixed(2);q.decalage=+(Math.hypot(p.pivot[0]-c[0],p.pivot[1]-c[1],p.pivot[2]-c[2])*sc).toFixed(3);}
    if(['tourelle','affut','canons_g'].includes(p.name)){const y0=mn[1]+.12*ext[1];let a=[1e9,1e9],b=[-1e9,-1e9];for(let i=0;i<pos.count;i++){if(pos.getY(i)>y0)continue;const x=pos.getX(i),z=pos.getZ(i);a=[Math.min(a[0],x),Math.min(a[1],z)];b=[Math.max(b[0],x),Math.max(b[1],z)];}
      const ring=[(a[0]+b[0])/2,(a[1]+b[1])/2];q.couronne=[+(ring[0]*sc).toFixed(3),+(ring[1]*sc).toFixed(3)];q.pivotHorsCouronne=+(Math.hypot(p.pivot[0]-ring[0],p.pivot[2]-ring[1])*sc).toFixed(3);
      q.pivotHorsBoite=+(Math.hypot(p.pivot[0]-c[0],p.pivot[2]-c[2])*sc).toFixed(3);q.largeur=+(Math.max(ext[0],ext[2])*sc).toFixed(2);r.ring=ring;r.turret=p.name;}
    r.parts[p.name]=q;}
  report[k]=r;
  // vue de dessus : la caisse, et la tourelle (ou l'affût, la casemate) avec ses armes à 0°, 90°, 180°, 270°
  const scene=new THREE.Scene();scene.add(new THREE.AmbientLight(0xffffff,1));const mkMesh=(geo,col,op)=>new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:col,transparent:op<1,opacity:op,depthWrite:op>=1}));
  scene.add(mkMesh(M.byName.caisse.geo,0x555a48,1));for(const p of M.parts)if(p.name.startsWith('roue'))scene.add(mkMesh(p.geo,0x3a3d32,1));
  const T=M.byName[r.turret];if(T){(T.name.startsWith('canons')?[-12,0,12]:[0,90,180,270]).forEach((deg,i)=>{const g=new THREE.Group();g.position.set(...T.pivot);g.rotation.y=deg*Math.PI/180;g.position.y+=.002*i+.05;
      const add=p=>{const m=mkMesh(p.geo,COL[i],.35);m.position.set(-T.pivot[0],-T.pivot[1],-T.pivot[2]);g.add(m);};add(T);for(const c of ['armes','canon','canons_d'])if(M.byName[c]&&(T.name==='tourelle'||c==='canons_d')){const q=M.byName[c];if(c==='canons_d'){const m=mkMesh(q.geo,COL[i],.35);const h=new THREE.Group();h.position.set(...q.pivot);h.rotation.y=deg*Math.PI/180;m.position.set(-q.pivot[0],-q.pivot[1],-q.pivot[2]);h.add(m);scene.add(h);}else add(q);}scene.add(g);});}
  const x0=n*W/cols,w=W/cols,h=H*.62;const S=Math.max(...M.ext)*.6,asp=w/h;const cam=new THREE.OrthographicCamera(-S*asp,S*asp,S,-S,-10,10);cam.position.set(0,5,0);cam.up.set(ax===0?-1:0,0,ax===2?-1:0);cam.lookAt(0,0,0);cam.updateMatrixWorld();
  R.setViewport(x0,H-h,w,h);R.setScissor(x0,H-h,w,h);R.setClearColor(0x2a2c23);R.render(scene,cam);
  const dot=(p,col)=>{const v=new THREE.Vector3(...p).project(cam);g2.fillStyle=col;g2.beginPath();g2.arc(x0+(v.x+1)/2*w,(1-v.y)/2*h,4,0,7);g2.fill();};
  if(T){dot(T.pivot,'#ff2020');dot([r.ring[0],T.pivot[1],r.ring[1]],'#20ff40');}for(const p of M.parts)if(p.name.startsWith('roue'))dot(p.pivot,'#ffffff');
  g2.fillStyle='#ddd';g2.font='15px sans-serif';g2.fillText(k+' — '+(r.turret||'')+' 0° rouge, 90° bleu, 180° jaune, 270° vert',x0+8,h+20);
  g2.font='12px monospace';const lines=JSON.stringify(r.parts[r.turret]||{})+'\nlarg. visible '+r.visLarge+' / emprise '+r.large+'\n'+Object.entries(r.parts).filter(([k])=>k.startsWith('roue')).map(([k,q])=>k+' L/H '+q.longSurHaut).join('  ');
  lines.split('\n').forEach((l,i)=>{let s=l;let y=h+42+i*18;while(s.length){g2.fillText(s.slice(0,48),x0+8,y);s=s.slice(48);y+=15;}});}
window.__pivots=report;document.title='prêt';
</script>
